name: printer-dashboard

services:
  printer-dashboard:
    build: .
    image: printer-dashboard:latest
    container_name: printer-dashboard
    restart: unless-stopped
    # Host networking is REQUIRED for mDNS multicast and SNMP broadcast to reach
    # printers on the LAN. Default bridge networking cannot see these packets.
    network_mode: host
    environment:
      PORT: "3000"
      POLL_INTERVAL_SEC: "60"
      DISCOVERY_INTERVAL_SEC: "300"
      SNMP_COMMUNITY: "public"
      SNMP_TIMEOUT_MS: "3000"
      HTTP_TIMEOUT_MS: "5000"
      DATA_DIR: "/data"
      LOG_LEVEL: "info"
    volumes:
      - printer-dashboard-data:/data

volumes:
  printer-dashboard-data:
