name: printer-dashboard

services:
  printer-dashboard:
    build: .
    image: printer-dashboard:latest
    container_name: printer-dashboard
    restart: unless-stopped
    # Host networking is REQUIRED for mDNS multicast and SNMP broadcast to reach
    # printers on the LAN. Default bridge networking cannot see these packets.
    network_mode: host
    # Defaults apply to everything else. Override SNMP_COMMUNITY or LOG_LEVEL
    # via the shell or .env if you need non-default values.
    volumes:
      - ${PRINTER_DASHBOARD_HOST_DIR}/data:/app/data
